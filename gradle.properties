# ---Gradle daemon & performance tuning
org.gradle.daemon=true

#Give the daemon enough heap/metaspace for a Serenity+Cucumber+Junit5 classpath
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

#Run the independent tasks in parallel where the module graph allows it
org.gradle.parallel=true

#Resue task outputs across runs instead of redoing unchanged work
org.gradle.caching=true
#Configure only the projects needed for the requested task
org.gradle.configureondemand=true

#Faster feedback on console
org.gradle.console=rich